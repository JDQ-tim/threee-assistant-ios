name: iOS Build

# 触发条件：
#  1. 手动点（Actions 页面 Run workflow）—— 最常用
#  2. push 到 main/master
#  3. 提 PR
on:
  workflow_dispatch:
    inputs:
      builds-on:
        description: '用哪台 macOS runner（排不上队就换一个）'
        required: false
        default: macos-14
        type: choice
        options:
          - macos-14
          - macos-15
          - macos-13
      # 只编译指定的文件（逗号分隔，仓库内相对路径）。
      # 拆分大工程用：一次编一半，两次各在 900 秒内跑完。
      # 留空 = 全量。
      only-files:
        description: '只编译这些文件（逗号分隔，留空=全量）'
        required: false
        default: ''
  push:
    branches: [main, master]
    # ⚠️ 只在源码/工程/工作流变了时才跑。
    #
    #    不加这个的话，改一行 README、传一张截图也会触发一次
    #    「xcodebuild 全量编译」，把共享池里的 macOS runner 白白占掉
    #    十几分钟 —— 而这正是「一直在排队」的来源之一。
    #    资源包、文档、tools/ 里的 Python 脚本都不影响 Swift 编译。
    paths:
      - 'ThreeeAssistant/**'
      - 'ThreeeAssistant.xcodeproj/**'
      - 'Config/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'ThreeeAssistant/**'
      - 'ThreeeAssistant.xcodeproj/**'
      - 'Config/**'
      - '.github/workflows/ios-build.yml'

# 同一分支重复触发时取消旧的，省钱
#
# ⚠️ 但推送一多，这个设置就变成了"永远跑不完"的主因：
#    每次 push 都把上一次**排了半天队**的 run 取消掉，等于队永远白排。
#    所以改成**只有手动触发时**才取消旧的；push 触发的运行不互相打断，
#    先拿到机器的那个就跑完。
#
#    （如果哪天觉得不该排队那么多次，就少推几次 —— 本地
#      tools/check_swift.py + find_isolation_issues.py 已经能挡住
#      绝大多数机械性错误，不必每改一行就推。）
concurrency:
  group: ios-build-${{ github.ref }}-${{ github.event_name }}-${{ github.run_id }}
  cancel-in-progress: false

# ============================================================
#  ⚠️ 902 秒：这个数字不是 timeout 造成的
#  ------------------------------------------------------------
#  实测有 4 次运行，从 job 开始到结束**恰好 902 秒**，结论 `cancelled`，
#  没有 artifact、没有步骤记录：
#
#     01:23:19 -> 01:38:21   902s  cancelled
#     01:51:33 -> 02:06:35   902s  cancelled
#     01:53:44 -> 02:08:46   902s  cancelled
#     02:12:03 -> 02:27:05   902s  cancelled
#
#  **订正**：以前这里写着「改成 20 分钟，主动地在自己这边收工，
#  而不是被动地被外面砍掉」。这个因果是错的 —— 902 秒是平台侧在掐，
#  不是本文件里任何 timeout 生效。下面 `timeout-minutes: 20` 保留，
#  但它保证不了什么：job 拿到机器之前，被掐与否完全由平台决定。
#
#  真正的机制是：job 排队**耗满 15 分钟仍分配不到 runner**，
#  平台就把这次运行判成 `completed / cancelled`，`steps` 为 0。
#  2026-10-26 那次连着 4 次触发全这样（macos-14 两次、macos-15、macos-13
#  那次更是一直挂着 21 小时不出结果）。同一时段换到北美深夜（北京时间中午）
#  再试，**秒分配到机器**，全程 94 秒跑完。
#
#  怎么区分「排队超时」和「编译失败」：
#      看 `actions/runs/{id}/jobs` 返回的每步记录 —— 
#      steps 为 0 → 排队超时，跟代码无关，别去改 Swift；
#      steps 有记录且编译步骤红 → 才是真错误。
#
#  配额与时段：公开仓库走的是全平台共享的 macOS 池，
#  免费额度按 macOS 分钟 ×10 折算进 2000 分钟/月。
#  额度耗尽的表现也是「一直 queued 然后超时」，API 读不到，只能去
#  https://github.com/settings/billing 看。
# ============================================================

jobs:
  build:
    name: Compile (Swift)
    # ============================================================
    #  为什么是 macos-14 而不是 macos-15
    #  ------------------------------------------------------------
    #  这个仓库是 **public**。GitHub 给公开仓库的 macOS runner 是共享池，
    #  macos-15 镜像新、要的人多，经常一整天排不上队（表现为一直 queued）。
    #  macos-14 池子更大、更容易拿到机器。
    #
    #  想手动换版本：Actions 页面 → Run workflow → 选 builds-on。
    # ============================================================
    # ⚠️ `inputs.builds-on` 只有手动触发时才有值，
    #    push 触发时它是空的，靠 `|| 'macos-14'` 兜底。
    #    （GitHub 对未定义的 inputs 求值成空串，不会报错。）
    runs-on: ${{ inputs.builds-on || 'macos-14' }}
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 显示工具链版本
        run: |
          echo "runner: $RUNNER_OS / $ImageOS"
          echo "=== Xcode ==="
          xcodebuild -version
          echo ""
          echo "=== 可用 SDK ==="
          xcodebuild -showsdks | grep -i iphone || true
          echo ""
          echo "=== Swift ==="
          swift --version
          echo ""
          echo "=== 工程里注册的 scheme ==="
          xcodebuild -project ThreeeAssistant.xcodeproj -list || true

      - name: 解析 Swift 包（如有）
        run: |
          if [ -f Package.swift ]; then
            swift package resolve
          else
            echo "无 Package.swift，跳过"
          fi

      # ============================================================
      #  契约回归：用**真实服务端响应**喂给 DTO，跑一次解码
      #  ------------------------------------------------------------
      #  这一步骤存在的理由，是两个真实事故：
      #    · ScheduleInstance.allDay 的 CodingKeys 漏了 "all_day" 映射
      #      → keyNotFound → 整个 SyncSnapshotResponse 解析失败
      #    · HealthDTO.modules 把服务端的对象声明成 String?
      #      → typeMismatch → 登录页「测试连接」明明服务器活着却报错
      #  两处**编译 100% 通过**，静态检查也过，只有真连服务端才炸。
      #
      #  这里不需要模拟器、不需要签名、不需要 UIKit：
      #  Models.swift / SyncModels.swift 只 import Foundation，
      #  和 Tests/DecodeCheck/main.swift 一起用 swiftc 编成命令行程序就能跑。
      #  实测编译 + 运行只要几秒，比 xcodebuild 快一个数量级。
      #
      #  fixtures 是 tools/probe_api.py 从真服务端抓下来的响应，
      #  改了接口就要重新抓：见 tools/README 里的命令。
      # ============================================================
      - name: 契约回归（真实响应解码）
        id: contract
        continue-on-error: true
        timeout-minutes: 5
        run: |
          mkdir -p build-logs
          set +e
          # ⚠️ 和编译步骤同样的理由：不要用 `| tee` 取退出码。
          #
          # 文件清单只放**纯 Foundation** 的：Models / SyncModels / DateHelp。
          #   带 UIKit 的（SessionStore、Keychain、TrustStore）不能进 ——
          #   macOS 上没有 UIKit，会直接编不过。
          #   DateHelp 是必须的：Models 里 `date.yearMonthDay` 用到了它。
          #   这种「扩展方法」依赖按类型名 grep 是搜不到的，
          #   第一次漏了它，CI 报的是 `Date has no member 'yearMonthDay'`。
          swiftc -O -o decode-check \
            ThreeeAssistant/Core/Models.swift \
            ThreeeAssistant/Core/SyncModels.swift \
            ThreeeAssistant/Core/DateHelp.swift \
            Tests/DecodeCheck/main.swift \
            > build-logs/contract-build.log 2>&1
          BUILD_RC=$?
          cat build-logs/contract-build.log

          if [ "$BUILD_RC" -ne 0 ]; then
            {
              echo "❌ 契约检查程序本身没编过 —— 这一关等于没验。"
              echo "   常见原因：swiftc 的文件清单漏了某个纯 Foundation 的依赖"
              echo "   （比如扩展方法定义在别的文件里，按类型名 grep 搜不到）。"
              echo "   详细编译错误："
              echo ""
              cat build-logs/contract-build.log
            } > build-logs/contract.log
            exit 1
          fi

          ./decode-check Tests/fixtures > build-logs/contract.log 2>&1
          RC=$?
          cat build-logs/contract.log

          # ---- 自检：确认这个检查器真的会报错 ----
          #
          # 不做这一步的话，「契约通过」可能只是因为**它从来没检查到东西** ——
          # 路径写错、fixture 没带上、case 清单空了，都会让程序
          # 平静地输出「失败 0 个」然后退 0。
          # 所以这里故意改坏一份 fixture，要求它必须被拒绝。
          #
          # 改的是 "all_day" 这个键名：ScheduleInstance 那边是
          # `c.decode(Bool.self, forKey: .allDay)`，非可选、没兜底，
          # 键一改名就是 keyNotFound，必然失败。
          mkdir -p build-logs/negative
          cp Tests/fixtures/SyncSnapshotResponse.json build-logs/negative/
          sed -i '' 's/"all_day"/"all_day_moved"/g' \
            build-logs/negative/SyncSnapshotResponse.json
          ./decode-check build-logs/negative > build-logs/contract-negative.log 2>&1
          NEG_RC=$?
          if [ "$NEG_RC" -eq 0 ]; then
            {
              echo ""
              echo "❌❌ 自检失败：故意改坏的 fixture 居然解码成功了。"
              echo "     这说明契约检查**形同虚设**，通过也不代表什么。"
              echo "     要么 case 清单里没有对应类型，要么 fixture 根本没被读到。"
            } | tee -a build-logs/contract.log
            RC=1
          else
            echo "" >> build-logs/contract.log
            echo "自检：改坏的 fixture 被正确拒绝 ✅" >> build-logs/contract.log
            echo "自检通过（故意改坏的 fixture 被拒绝，退出码 $NEG_RC）"
          fi

          echo "契约检查退出码：$RC"
          exit $RC

      # ============================================================
      #  请求契约：客户端会发的键 vs 服务端会读的键
      #  ------------------------------------------------------------
      #  和上面的「契约回归」是两个方向，不能互相替代：
      #    · 契约回归 = 服务端发 → 客户端解（错了会抛 keyNotFound，响亮的失败）
      #    · 请求契约 = 客户端发 → 服务端读（错了服务端当没传，**静默失效**）
      #
      #  典型事故：客户端把 `minutes_before` 写成 `offset_sec`，
      #  服务端读到空值按 0 处理，HTTP 200、不报错、提醒永远不响。
      #  这种问题只有对着两边的字段名逐个比才看得见。
      #
      #  CI 拿不到服务端 Go 源码，所以比的是仓库里的字段快照
      #  Tests/server-request-keys.json（由 `--dump` 生成）。
      #  服务端改了请求字段要记得重新 dump，否则这里比的是旧契约。
      # ============================================================
      - name: 请求契约（发的键 vs 读的键）
        id: reqcontract
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set +e
          python3 tools/check_request_contract.py > build-logs/request-contract.log 2>&1
          RC=$?
          cat build-logs/request-contract.log
          exit $RC

      # 关键步骤：先生成模拟器架构的构建，不做代码签名。
      # 这样即使没有苹果开发者账号也能验证「代码能否编译通过」。
      #
      # ============================================================
      #  这里每个参数都是为了让「编译在 900 秒内出结论」
      #  ------------------------------------------------------------
      #  ONLY_ACTIVE_ARCH=YES
      #      **实测在这里是空操作，别指望它省时间。**
      #      这里的 destination 是 `generic/platform=iOS Simulator`，
      #      generic 目标没有「活动架构」的概念，ARCHS 仍然展开成
      #      arm64 + x86_64 两份，最后 lipo 成胖二进制。
      #      证据：run 40450531367 产出的可执行文件
      #      magic=0xcafebabe、nfat_arch=2（x86_64 13.5MB + arm64 13.2MB）。
      #
      #      以前这里写着「不留这个的话会同时编两份，时间直接翻倍」——
      #      因果说反了：留了它也在编两份。真想让编译时间减半，
      #      得写 `ARCHS=arm64`（代价：Intel Mac 的模拟器跑不了）。
      #      目前**故意保留双架构**，因为产物要能装进任何一台 Mac 的模拟器。
      #
      #      实测代价：双架构全量编译 71~87 秒，可以接受。
      #
      #  SWIFT_COMPILATION_MODE=singlefile
      #      默认是全模块优化（对 Debug 是 incremental）。singlefile
      #      每编完一个文件就落盘，被掐掉时**已经编过的文件结论仍在**，
      #      下次能看到真实的错误分布，而不是「什么都没编完」。
      #
      #  ⚠️ 不要加 `-quiet`。
      #     试过一次，代价很具体：`-quiet` 只放 warning/error，
      #     它把 `** BUILD SUCCEEDED **` 和所有 `SwiftCompile` 行一起吞了。
      #     结果编译明明成功（退出码 0），日志里一个字都没有，
      #     「结论」判定看到「既没有 SUCCEEDED 也没有 FAILED」，
      #     于是报成「被掐断」—— 白白多推一次。
      #     完整日志压缩后只有几十 KB，不值得为省这点体积牺牲可判断性。
      # ============================================================
      - name: 编译（模拟器架构，不签名）
        id: build
        continue-on-error: true
        # 比 job 的 20 分钟短，保证后面提炼报错/上传 artifact 有时间跑
        timeout-minutes: 15
        env:
          # 手动触发时可以只编一部分，拆成多次跑（大工程分片用）
          ONLY_FILES: ${{ inputs.only-files }}
        run: |
          set -o pipefail
          mkdir -p build-logs

          ARGS=(
            -project ThreeeAssistant.xcodeproj
            -scheme ThreeeAssistant
            -configuration Debug
            -sdk iphonesimulator
            -destination 'generic/platform=iOS Simulator'
            # ⚠️ 必须显式指定产物目录。
            #    不指定的话 xcodebuild 会把产物丢到
            #    ~/Library/Developer/Xcode/DerivedData/ThreeeAssistant-<随机hash>/
            #    那个 hash 每次都不一样，下面的 upload-artifact 路径**永远匹配不上**，
            #    而 `if-no-files-found: ignore` 又会把这个失败静默吞掉 ——
            #    结果是「步骤显示 success，但附件里只有日志、没有 .app」。
            #    （2026-10-27 run 40449753874 就是这么丢的。）
            -derivedDataPath build/DerivedData
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=
            ONLY_ACTIVE_ARCH=YES
            SWIFT_COMPILATION_MODE=singlefile
          )

          # 分片编译：把 --only-files 传给 swiftc 的话不行，
          # xcodebuild 没有这个能力。所以分片的做法是拿掉一部分文件的
          # 编译任务 —— 这里没实现，留个明确的提示，别让人以为传了有用
          if [ -n "$ONLY_FILES" ]; then
            echo "⚠️ only-files 参数目前未实现（xcodebuild 不支持按文件编）"
            echo "   会按全量跑。"
          fi

          # 计时，方便和 902 秒那条线对照
          START=$(date +%s)
          # ⚠️ 用 `> 文件 2>&1` 而不是 `| tee`：tee 之后 PIPESTATUS
          #    在某些 executor 上取不到，退出码会变成空串，
          #    `exit $RC` 就变成了 `exit`（退出码由上条命令决定）。
          #    直接重定向 + `$?` 最稳。
          xcodebuild "${ARGS[@]}" build > build-logs/full.log 2>&1
          RC=$?
          END=$(date +%s)

          echo "" >> build-logs/full.log
          echo "===== 编译耗时 $((END-START)) 秒，退出码 $RC =====" >> build-logs/full.log

          # 退出码不是 0 但日志里没有结论行时，补一行 —— 
          # 「提炼报错」那步靠它区分「正常失败」和「被掐断」
          if [ "$RC" -ne 0 ] && ! grep -q "BUILD FAILED" build-logs/full.log; then
            echo "** BUILD FAILED **（按退出码补写，日志里没有原生结论行）" >> build-logs/full.log
          fi

          cat build-logs/full.log
          exit $RC

      - name: 提炼报错
        if: always()
        run: |
          mkdir -p build-logs
          # Swift 编译错误格式： /path/File.swift:12:34: error: message
          grep -E ":[0-9]+:[0-9]+: (error|warning):" build-logs/full.log \
            | sed -E 's|^.*/(ThreeeAssistant/[^:]+)|\1|' \
            > build-logs/problems.txt || true

          # ⚠️ 用 `|| true` 而不是 `|| echo 0`。
          #    `grep -c` 在 0 命中时会**先输出 0，再以退出码 1 结束**，
          #    后面接 `|| echo 0` 就会得到 "0\n0" —— SUMMARY 里会看到两行。
          ERR=$(grep -c ': error:' build-logs/problems.txt 2>/dev/null || true)
          WARN=$(grep -c ': warning:' build-logs/problems.txt 2>/dev/null || true)
          # 编译记录条数 —— 用来区分「真编了」和「DerivedData 复用没编」
          SWIFT_HITS=$(grep -cE "^(SwiftCompile|CompileSwiftSources|SwiftDriver|CompileSwift)" \
                       build-logs/full.log 2>/dev/null || true)
          # 空文件时 grep -c 什么都不输出，兜个默认值
          ERR=${ERR:-0}
          WARN=${WARN:-0}
          SWIFT_HITS=${SWIFT_HITS:-0}

          {
            echo "# 编译结果"
            echo ""
            if [ -s build-logs/problems.txt ]; then
              echo "## 发现的问题（按文件:行:列）"
              echo ""
              echo '```'
              cat build-logs/problems.txt
              echo '```'
              echo ""
            else
              echo "没有解析到 Swift 语法错误。"
              echo ""
            fi
            echo "错误数：$ERR"
            echo "警告数：$WARN"
            echo "Swift 编译记录：$SWIFT_HITS 条"
            echo ""

            # ---- 契约回归结果 ----
            # 「编译通过」和「连得上服务端」是两件事，必须分开报。
            # 不写进摘要的话，这一步骤红了也没人看见。
            echo "## 契约回归（真实响应解码）"
            if [ -f build-logs/contract.log ]; then
              echo '```'
              tail -n 24 build-logs/contract.log
              echo '```'
            else
              echo "没有产出 contract.log —— 检查程序本身可能没编过，见 contract-build.log"
            fi
            echo ""

            echo "## 请求契约（发的键 vs 读的键）"
            if [ -f build-logs/request-contract.log ]; then
              echo '```'
              tail -n 14 build-logs/request-contract.log
              echo '```'
            else
              echo "没有产出 request-contract.log"
            fi
            echo ""

            echo "## 结论"
            if grep -q "BUILD SUCCEEDED" build-logs/full.log; then
              if [ "$SWIFT_HITS" -eq 0 ]; then
                # 这一步很关键：见过一份「BUILD SUCCEEDED」，打开一看
                # 整份日志 0 条 Swift 编译记录、却有 lipo 和 Validate ——
                # 那是拿旧产物拼出来的增量构建，什么都没重编。
                echo "⚠️ **结论不可信**：报了 SUCCEEDED，但日志里没有任何 Swift 编译记录。"
                echo ""
                echo "这说明 DerivedData 被复用了，本次没有真正编译任何源文件。"
                echo "不能据此认为代码是好的 —— 请用 macOS 上「Clean Build Folder」后重跑，"
                echo "或者把 runner 换一台。"
              else
                echo "✅ **编译通过**（$SWIFT_HITS 条编译记录，说明确实编译了）"
              fi
            else
              echo "❌ **编译失败 / 没有结论**，详见下方日志尾部"
              echo ""
              if ! grep -q "BUILD FAILED" build-logs/full.log; then
                echo "注意：日志里连 \`BUILD FAILED\` 都没有，说明是**被掐断**的，"
                echo "不是正常失败。下面列出的错误只是「掐断前已报出的那部分」，"
                echo "修完可能还有别的 —— 不要以为修干净了。"
              fi
            fi
          } > build-logs/SUMMARY.md

          {
            echo "===== 最后 220 行 ====="
            tail -n 220 build-logs/full.log
          } > build-logs/tail.txt

          cat build-logs/SUMMARY.md

      - name: 把报告贴到任务摘要
        if: always()
        run: |
          if [ -f build-logs/SUMMARY.md ]; then
            cat build-logs/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f build-logs/tail.txt ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat build-logs/tail.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      # 不管成功失败都把日志带走，方便下载回来看
      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-logs/
          retention-days: 30

      # 成功了就把 .app 也带走（模拟器版本，可直接拖进 Simulator）
      - name: 上传构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ThreeeAssistant-simulator-app
          # 路径必须跟上面 ARGS 里的 `-derivedDataPath build/DerivedData` 一致。
          # 以前这里只写了 `DerivedData/...` 和 `build/Build/Products/...`，
          # 全都不匹配真实的 `~/Library/Developer/Xcode/DerivedData/ThreeeAssistant-<hash>/`，
          # 于是每次都「上传成功但什么都没传」—— 附件里一直只有日志。
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: ignore
          retention-days: 30

      - name: 根据编译结果决定任务成败
        if: always()
        run: |
          # 契约先判：它比编译更能说明「这个 App 连上服务端会不会白屏」。
          # 编译过了但契约挂了，是**不能发**的状态，必须让任务红。
          CONTRACT_OK=1
          if [ -f build-logs/contract.log ]; then
            # 必须同时满足「解码数 ≥ 1」和「失败 0 个」。
            # 只判「失败 0 个」会假通过：fixture 目录没带上时程序输出
            # 「解码 0 个，失败 0 个」，照样能 grep 到。
            if grep -qE "解码 [1-9][0-9]* 个，失败 0 个" build-logs/contract.log; then
              echo "✅ 契约回归通过"
              CONTRACT_OK=0
            else
              echo "❌ 契约回归失败 —— DTO 和服务端对不上，真机会整包解析失败"
              grep "^❌" build-logs/contract.log || echo "   （日志里没有 ❌ 行，可能是解码数为 0）"
            fi
          else
            echo "⚠️ 没有 contract.log，契约这一关视为未通过"
          fi

          # 请求契约：全对齐才算过。工具最后一行是「全部对齐」或「发现 N 组不一致」。
          REQ_OK=1
          if [ -f build-logs/request-contract.log ]; then
            if grep -q "全部对齐" build-logs/request-contract.log; then
              echo "✅ 请求契约对齐"
              REQ_OK=0
            else
              echo "❌ 请求契约不一致 —— 客户端发的键服务端不读，或反之（静默失效）"
              grep "^❌" build-logs/request-contract.log || true
            fi
          else
            echo "⚠️ 没有 request-contract.log，请求契约这一关视为未通过"
          fi

          if grep -q "BUILD SUCCEEDED" build-logs/full.log 2>/dev/null; then
            # 见到过「SUCCEEDED 但一条 Swift 编译记录都没有」的增量构建。
            # 那种结果不能当通过 —— 等于这一趟什么都没验证。
            if ! grep -qE "^(SwiftCompile|CompileSwiftSources|SwiftDriver|CompileSwift)" \
                 build-logs/full.log 2>/dev/null; then
              echo "⚠️ 报了 SUCCEEDED 但没有任何 Swift 编译记录（增量构建），结论不可信"
              echo "   请 Clean Build Folder 后重跑，或换一台 runner"
              exit 1
            fi
            if [ "$CONTRACT_OK" -ne 0 ]; then
              echo "⚠️ BUILD SUCCEEDED，但契约回归没过 —— 编译只能证明语法对，"
              echo "   不能证明字段名/类型对。请修完 DTO 再发版。"
              exit 1
            fi
            if [ "$REQ_OK" -ne 0 ]; then
              echo "⚠️ BUILD SUCCEEDED，但请求契约不一致 —— 这类错**不会报错**，"
              echo "   只会让功能悄悄失效（服务端当那个字段没传）。请核对字段名。"
              exit 1
            fi
            echo "✅ BUILD SUCCEEDED 且双向契约都通过"
            exit 0
          fi
          if ! grep -q "BUILD FAILED" build-logs/full.log 2>/dev/null; then
            echo "❌ 日志没有结论 —— 编译被掐断了，不是正常失败"
            echo "   错误清单只是下界，修完可能还有。请下载 build-logs 附件确认"
            exit 1
          fi
          echo "❌ BUILD FAILED —— 请下载 build-logs 附件，或直接看本页的 Summary"
          exit 1
